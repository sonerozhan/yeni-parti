<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özgür Özel - Yeni Parti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* Üst Menü */
        .navbar {
            background-color: #c8102e;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar .logo {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            text-decoration: none;
        }

        .navbar .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .navbar .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .navbar .nav-links a:hover {
            text-decoration: underline;
        }

        /* Ana Karşılama Alanı (Hero) - Resim Arkaya Alındı */
        .hero {
            position: relative;
            width: 100%;
            min-height: 85vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 100px 80px 50px 80px;
            margin-top: 60px; /* Navbar payı */
            
            /* Kırmızı filtre ve arkadaki resim */
            background: linear-gradient(rgba(200, 16, 46, 0.85), rgba(200, 16, 46, 0.85)), 
                        url('buraya-arkaplan-fotografinin-linki-gelecek.jpg') no-repeat center center/cover;
            color: #ffffff;
        }

        .hero-content {
            max-width: 600px;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
            opacity: 0.95;
        }

        /* Butonlar */
        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-uye {
            background-color: #ffffff;
            color: #c8102e;
        }

        .btn-uye:hover {
            background-color: #f0f0f0;
        }

        .btn-bilgi {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-bilgi:hover {
            background-color: #ffffff;
            color: #c8102e;
        }

        /* Sağ taraftaki eski küçük kutuyu kaldırdık, çünkü resim artık tüm arka plana yayıldı */

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .hero {
                padding: 40px 20px;
                flex-direction: column;
                text-align: center;
            }
            .hero h1 {
                font-size: 2.2rem;
            }
            .btn-group {
                justify-content: center;
            }
            .navbar .nav-links {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- Üst Menü -->
    <nav class="navbar">
        <a href="#" class="logo">Özgür Özel</a>
        <ul class="nav-links">
            <li><a href="#hakkinda">Hakkında</a></li>
            <li><a href="#haberler">Haberler</a></li>
            <li><a href="#uye">Üye Ol</a></li>
            <li><a href="#iletisim">İletişim</a></li>
        </ul>
    </nav>

    <!-- Hero Bölümü (Arka planı resimli, yazıları solda) -->
    <header class="hero">
        <div class="hero-content">
            <h1>Türkiye'nin Geleceği İçin Yeni Bir Vizyon</h1>
            <p>Halkın sesini duyuran, adil ve şeffaf bir siyaset için birlikte hareket edelim. Özgür bir gelecek omuz omuza kurulur.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-uye">Üye Ol</a>
                <a href="#" class="btn btn-bilgi">Daha Fazla Bilgi</a>
            </div>
        </div>
    </header>

</body>
</html>v

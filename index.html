<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özgür Özel - Yeni Parti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
        }

        /* Arka plan görseli ve kırmızı filtre */
        .hero {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 80px;
            
            /* Burada kırmızı yarı şeffaf filtre var, arkasından da gerçek bir miting/kalabalık fotoğrafı yükleniyor */
            background: linear-gradient(rgba(200, 16, 46, 0.75), rgba(200, 16, 46, 0.85)), 
                        url('https://images.unsplash.com/photo-1540910419892-4a36d2c3266c?q=80&w=1600&auto=format&fit=crop') no-repeat center center/cover;
            color: #ffffff;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        /* Butonlar */
        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-uye {
            background-color: #ffffff;
            color: #c8102e;
        }

        .btn-uye:hover {
            background-color: #f0f0f0;
        }

        .btn-bilgi {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-bilgi:hover {
            background-color: #ffffff;
            color: #c8102e;
        }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .hero {
                padding: 0 20px;
                text-align: center;
                justify-content: center;
            }
            .hero h1 {
                font-size: 2.3rem;
            }
            .btn-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Arka Planı Resimli, Kırmızı Temalı Alan -->
    <header class="hero">
        <div class="hero-content">
            <h1>Türkiye'nin Geleceği İçin Yeni Bir Vizyon</h1>
            <p>Halkın sesini duyuran, adil ve şeffaf bir siyaset için birlikte hareket edelim. Özgür bir gelecek omuz omuza kurulur.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-uye">Üye Ol</a>
                <a href="#" class="btn btn-bilgi">Daha Fazla Bilgi</a>
            </div>
        </div>
    </header>

</body>
</html>

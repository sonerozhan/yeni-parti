<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özgür Özel - Yeni Parti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
        }

        .hero {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 0 80px;
            
            /* Gönderdiğin fotoğrafı arka plana tam oturtuyoruz. 
               Yazıların net okunması için arkaya çok hafif yumuşak bir karartma verdik. */
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55)), 
                        url('https://i.hizliresim.com/6j0v1c4.jpg') no-repeat center center/cover;
            color: #ffffff;
        }

        .hero-content {
            max-width: 650px;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-uye {
            background-color: #c8102e; /* Parti Kırmızısı */
            color: #ffffff;
        }

        .btn-uye:hover {
            background-color: #a00d24;
        }

        .btn-bilgi {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-bilgi:hover {
            background-color: #ffffff;
            color: #333333;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 0 20px;
                text-align: center;
                justify-content: center;
            }
            .hero h1 {
                font-size: 2.3rem;
            }
            .btn-group {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-content">
            <h1>Türkiye'nin Geleceği İçin Yeni Bir Vizyon</h1>
            <p>Halkın sesini duyuran, adil ve şeffaf bir siyaset için birlikte hareket edelim. Özgür bir gelecek omuz omuza kurulur.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-uye">Üye Ol</a>
                <a href="#" class="btn btn-bilgi">Daha Fazla Bilgi</a>
            </div>
        </div>
    </header>

</body>
</html>

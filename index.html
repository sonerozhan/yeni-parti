<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelecek Bizimle - Yeni Parti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Hero / Arka Plan Alanı */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(rgba(139, 0, 0, 0.7), rgba(11, 11, 11, 0.9)), 
                        url('buraya-ozgur-ozel-ve-kalabalik-fotografi-gelecek.jpg') no-repeat center center/cover;
            padding: 0 20px;
        }

        .hero-content {
            max-width: 800px;
            z-index: 2;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        .hero h1 span {
            color: #ff1e1e;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            color: #e0e0e0;
            line-height: 1.6;
        }

        /* Butonlar */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 4px;
            transition: 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-primary {
            background-color: #d90429;
            color: #ffffff;
            border: 2px solid #d90429;
        }

        .btn-primary:hover {
            background-color: #ef233c;
            box-shadow: 0 0 15px rgba(217, 4, 4, 0.7);
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #ffffff;
        }

        .btn-secondary:hover {
            background-color: #ffffff;
            color: #0b0b0b;
        }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.3rem;
            }
            .hero p {
                font-size: 1rem;
            }
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <!-- Ana Karşılama Alanı (Hero) -->
    <header class="hero">
        <div class="hero-content">
            <h1>Geleceği Birlikte <span>Yeniden Yazıyoruz</span></h1>
            <p>Adalet, eşitlik ve aydınlık yarınlar için omuz omuza veriyoruz. Özgür bir Türkiye inşasına sen de katıl, gücümüze güç kat.</p>
            <div class="btn-group">
                <a href="#gonullu" class="btn btn-primary">Gönüllü Ol</a>
                <a href="#manifesto" class="btn btn-secondary">Manifestomuz</a>
            </div>
        </div>
    </header>

</body>
</html>
